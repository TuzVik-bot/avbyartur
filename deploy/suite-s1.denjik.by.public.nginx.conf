# Public-launch variant of the pilot vhost: identical to
# deploy/suite-s1.denjik.by.pilot.nginx.conf but WITHOUT the global
# X-Robots-Tag noindex header — the app manages robots per page in the
# public indexing mode.
#
# Before applying on the VPS, diff this template against the LIVE
# /etc/nginx/sites-available/suite-s1.denjik.by and re-apply any
# server-specific drift that happened outside this repository.
# Run `nginx -t` before `systemctl reload nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name suite-s1.denjik.by;
    charset utf-8;
    server_tokens off;
    # The API accepts 20 MiB photos; leave room for multipart framing.
    client_max_body_size 24m;

    # General password disabled by user request on 2026-10-04.
    auth_basic off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Application readiness is checked separately by Docker healthchecks.
    location = /healthz {
        default_type text/plain;
        alias /var/www/suite-s1.denjik.by/healthz.txt;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
