# The existing external OpenResty proxy terminates HTTPS and redirects HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name xn--80aeylebmo7f.xn--90ais www.xn--80aeylebmo7f.xn--90ais;
    charset utf-8;
    server_tokens off;
    # The API accepts 20 MiB photos; leave room for multipart framing.
    client_max_body_size 24m;

    # This vhost sits behind the external OpenResty on the LAN
    # (192.168.213.253), so $remote_addr is that proxy for every client and the
    # real client IP never reaches web/api. Restore it from OpenResty's
    # X-Forwarded-For. Applying this needs root on the host and a prior check
    # that OpenResty sets or appends X-Forwarded-For with the client IP and that
    # nothing else can reach this listener from these addresses. Until then the
    # API treats the resolved proxy IP as "client unknown" and widens IP limits.
    set_real_ip_from 192.168.213.253;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    auth_basic off;
    # auth_basic_user_file /etc/nginx/.htpasswd-suite-s1.denjik.by;  # disabled for user testing

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Host liveness is independent of neighbouring static sites.
    # Application readiness is checked separately by Docker healthchecks.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
