# TLS and the HTTP-to-HTTPS redirect are handled by the existing external proxy.
server {
    listen 80;
    listen [::]:80;
    server_name suite-s1.denjik.by;

    root /var/www/suite-s1.denjik.by;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Remove this header when publishing the actual new website.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
