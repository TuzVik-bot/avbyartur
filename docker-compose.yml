name: avtorinok

# Every backend Settings field, shared by api and worker so that a feature
# configured in .env reaches both processes. Defaults mirror
# backend/app/config.py; secrets default to empty (feature disabled).
# backend/tests/test_compose_settings.py keeps this list in sync.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-avtorinok}:${POSTGRES_PASSWORD:?Run scripts/init-secrets.sh first}@db:5432/${POSTGRES_DB:-avtorinok}
  SESSION_SECRET: ${SESSION_SECRET:?Run scripts/init-secrets.sh first}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-avtorinok_session}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  SESSION_DAYS: ${SESSION_DAYS:-7}
  CATALOG_PATH: /app/data/catalog.json
  MEDIA_ROOT: /app/private-media
  PRIVATE_LISTING_QUOTA: ${PRIVATE_LISTING_QUOTA:-5}
  COMPANY_LISTING_QUOTA: ${COMPANY_LISTING_QUOTA:-50}
  LISTING_AUTO_PUBLISH_ENABLED: ${LISTING_AUTO_PUBLISH_ENABLED:-false}
  SAVED_SEARCH_LIMIT: ${SAVED_SEARCH_LIMIT:-20}
  SAVED_SEARCH_MUTATIONS_PER_HOUR: ${SAVED_SEARCH_MUTATIONS_PER_HOUR:-60}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
  UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-60000000}
  # The API port is not published (expose only), so only containers on the
  # private `app` network can reach it; the web proxy forwards the client IP
  # from nginx in X-Forwarded-For. Trusting docker's private ranges lets
  # client_ip() use that header while direct peers outside them are ignored.
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  SMS_LOGIN_ENABLED: ${SMS_LOGIN_ENABLED:-false}
  PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
  EMAIL_REGISTRATION_ENABLED: ${EMAIL_REGISTRATION_ENABLED:-false}
  EMAIL_REGISTRATION_PILOT_ENABLED: ${EMAIL_REGISTRATION_PILOT_ENABLED:-false}
  PUBLIC_GUEST_CONTACT_ENABLED: ${PUBLIC_GUEST_CONTACT_ENABLED:-false}
  GUEST_CONTACT_IP_HOURLY_LIMIT: ${GUEST_CONTACT_IP_HOURLY_LIMIT:-30}
  SMS_OTP_SECRET: ${SMS_OTP_SECRET:-}
  SMS_OTP_LIFETIME_SECONDS: ${SMS_OTP_LIFETIME_SECONDS:-300}
  SMS_OTP_MAX_ATTEMPTS: ${SMS_OTP_MAX_ATTEMPTS:-5}
  SMS_OTP_SENDS_PER_HOUR: ${SMS_OTP_SENDS_PER_HOUR:-5}
  SMS_OTP_RESEND_COOLDOWN_SECONDS: ${SMS_OTP_RESEND_COOLDOWN_SECONDS:-60}
  SMS_OTP_IP_REQUESTS_PER_HOUR: ${SMS_OTP_IP_REQUESTS_PER_HOUR:-30}
  SMS_OTP_IP_VERIFICATIONS_PER_HOUR: ${SMS_OTP_IP_VERIFICATIONS_PER_HOUR:-30}
  SMS_OTP_PHONE_VERIFICATIONS_PER_HOUR: ${SMS_OTP_PHONE_VERIFICATIONS_PER_HOUR:-10}
  REGISTRATION_TERMS_VERSION: ${REGISTRATION_TERMS_VERSION:-}
  REGISTRATION_PRIVACY_VERSION: ${REGISTRATION_PRIVACY_VERSION:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-disabled}
  SMSC_API_KEY: ${SMSC_API_KEY:-}
  SMSC_API_URL: ${SMSC_API_URL:-https://smsc.ru/sys/send.php}
  SMSC_SENDER: ${SMSC_SENDER:-}
  SMSC_TIMEOUT_SECONDS: ${SMSC_TIMEOUT_SECONDS:-5}
  TEST_MAIL_ENABLED: ${TEST_MAIL_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_SSL: ${SMTP_SSL:-false}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  # Path inside the container; the host status file must be mounted there.
  MONITORING_STATUS_PATH: ${MONITORING_STATUS_PATH:-}
  LISTING_STOP_WORDS_CSV: ${LISTING_STOP_WORDS_CSV:-}
  MINIMUM_PHOTOS_NEW: ${MINIMUM_PHOTOS_NEW:-1}
  MINIMUM_PHOTOS_USED: ${MINIMUM_PHOTOS_USED:-1}
  MINIMUM_PHOTOS_DAMAGED: ${MINIMUM_PHOTOS_DAMAGED:-1}
  MINIMUM_PHOTOS_PARTS: ${MINIMUM_PHOTOS_PARTS:-1}
  LISTING_YEAR_MIN: ${LISTING_YEAR_MIN:-1886}
  LISTING_FUTURE_NEW_YEARS: ${LISTING_FUTURE_NEW_YEARS:-1}
  ONLINER_BASE_URL: ${ONLINER_BASE_URL:-https://ab.onliner.by/sdapi/ab.api}
  ONLINER_REQUEST_INTERVAL_SECONDS: ${ONLINER_REQUEST_INTERVAL_SECONDS:-1.0}
  ONLINER_PER_MAKE_LIMIT: ${ONLINER_PER_MAKE_LIMIT:-10}
  ONLINER_MAX_PHOTOS: ${ONLINER_MAX_PHOTOS:-30}
  ONLINER_SYNC_ENABLED: ${ONLINER_SYNC_ENABLED:-false}
  ONLINER_SYNC_OWNER_EMAIL: ${ONLINER_SYNC_OWNER_EMAIL:-}
  ONLINER_SYNC_INTERVAL_HOURS: ${ONLINER_SYNC_INTERVAL_HOURS:-6}
  ONLINER_SYNC_MANUFACTURERS: ${ONLINER_SYNC_MANUFACTURERS:-all}


services:
  db:
    # Digest pinning is deferred to a maintenance window: changing the image
    # reference recreates the production database container on the next `up`.
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avtorinok}
      POSTGRES_USER: ${POSTGRES_USER:-avtorinok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-secrets.sh first}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers=2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 1m
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - app

  api:
    image: avtorinok-api:${AVTORINOK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ./data:/app/data:ro
      - private_media:/app/private-media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  worker:
    image: avtorinok-api:${AVTORINOK_IMAGE_TAG:-local}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - private_media:/app/private-media
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys; sys.exit(0 if b'app.worker' in open('/proc/1/cmdline', 'rb').read() else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 96
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  web:
    image: avtorinok-web:${AVTORINOK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SITE_NAME: ${SITE_NAME:-Авторынок BY}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://авторынок.бел}
      API_INTERNAL_URL: http://api:8000
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_FALLBACK_MODELS: ${ASSISTANT_FALLBACK_MODELS:-}
      ASSISTANT_DAILY_MODEL_BUDGET: ${ASSISTANT_DAILY_MODEL_BUDGET:-45}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 30s
    mem_limit: 640m
    cpus: 1.25
    pids_limit: 128
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  test-mail:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    profiles: ["test-mail"]
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_MAX_AGE: 7d
      MP_MAX_MESSAGE_SIZE: 1
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *bounded-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [app]

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-avtorinok_postgres}
  private_media:
    name: ${PRIVATE_MEDIA_VOLUME:-avtorinok_private_media}

networks:
  app:
    driver: bridge
