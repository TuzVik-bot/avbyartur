[project]
name = "avtorinok-backend"
version = "0.1.0"
description = "Closed-pilot vehicle marketplace API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.2",
  "argon2-cffi==23.1.0",
  "defusedxml==0.7.1",
  "email-validator==2.2.0",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pillow-heif==1.8.0",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.32",
  "sentry-sdk==2.71.0",
  "sqlalchemy==2.0.41",
  "starlette==1.6.0",
  "uvicorn[standard]==0.34.3",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pyyaml>=6.0",
  "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
# De-facto width of the codebase: 99% of lines in app/ and tests/ fit in 120 columns.
line-length = 120
extend-exclude = [".codex-test-deps-*"]

[tool.ruff.lint]
select = ["E9", "F", "B", "UP"]
# Lint debt: rules that fired when ruff was introduced (2026-11-10), with counts
# in app/ and tests/. Remove an entry once its count reaches zero.
ignore = [
  "UP017",  # 197: datetime.timezone.utc -> datetime.UTC
  "UP012",  # 3: unnecessary .encode("utf-8")
  "UP035",  # 2: typing imports that moved to collections.abc
  "UP037",  # 2: quoted annotations
  "B010",   # 1: setattr with a constant attribute name
  "B905",   # 1: zip() without strict=
  "F841",   # 1: unused local variable (tests)
]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated boilerplate with version-pinned imports.
"alembic/**" = ["F401", "UP"]
