[project]
name = "avtorinok-backend"
version = "0.1.0"
description = "Closed-pilot vehicle marketplace API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.2",
  "argon2-cffi==23.1.0",
  "email-validator==2.2.0",
  "fastapi==0.142.2",
  "pillow==12.3.0",
  "pillow-heif==1.8.0",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.32",
  "sentry-sdk==2.71.0",
  "sqlalchemy==2.0.41",
  "starlette==1.6.0",
  "uvicorn[standard]==0.34.3",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
