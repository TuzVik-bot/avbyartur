# The existing external OpenResty proxy terminates HTTPS and redirects HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name suite-s1.denjik.by;
    charset utf-8;
    server_tokens off;
    # The API accepts 20 MiB photos; leave room for multipart framing.
    client_max_body_size 24m;

    # General password disabled by user request on 2026-10-04.
    auth_basic off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Application readiness is checked separately by Docker healthchecks.
    location = /healthz {
        default_type text/plain;
        alias /var/www/suite-s1.denjik.by/healthz.txt;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
